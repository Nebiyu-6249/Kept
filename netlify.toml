# Default for every deploy context. Deliberately does NOT run migrations:
# a deploy preview or a branch deploy must never alter the production schema.
#
# next build needs no database at all — every route is force-dynamic and
# nothing queries at build time — so a preview build touches Postgres zero times.
[build]
  command = "npm run preflight && prisma generate && next build"
  publish = ".next"

# Production is the one context that migrates. Running it here rather than in a
# separate CI job keeps the ordering guarantee for free: the migration finishes
# immediately before the build that ships the code depending on it, with no
# coordination between two systems racing on one database. See DECISIONS.md.
#
# The preflight runs first and in --migrations mode, so a missing or pooled
# DIRECT_URL fails in seconds with an actionable message instead of three
# minutes later as Prisma P1012.
[context.production]
  command = "npm run preflight:migrations && prisma generate && prisma migrate deploy && next build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # The build specification (§3) puts the functions under src/netlify/functions.
  # Netlify defaults to netlify/functions at the repository root, so without this
  # it would find zero functions and fail silently — no cron, no background
  # import, no error message anywhere.
  directory = "src/netlify/functions"

  # Retained for any future v1 (CommonJS handler) function. Both functions here
  # are v2 ESM, which zip-it-and-ship-it always bundles with nft regardless of
  # this setting — verified by bundling them and reading back bundler=nft.
  node_bundler = "esbuild"

  # nft does trace the Prisma query engine on its own through @prisma/client,
  # verified by bundling without this line and finding
  # libquery_engine-debian-openssl-3.0.x.so.node present anyway. It stays as
  # insurance: native binary tracing is the part most likely to change under us,
  # and the cost of being explicit is nothing.
  included_files = ["node_modules/.prisma/client/**"]

# One table per function. [functions.nightly-sweep] and [functions."nightly-sweep"]
# are the same key to a TOML parser, so declaring both is a redefinition error and
# the deploy dies before the build starts.
#
# Scheduled functions cap at 30s and receive no payload. runNightlySweep keeps a
# 20s budget and reports when it stopped early.
#
# This schedule is duplicated in the function's own `export const config`.
# scripts/check-netlify-config.ts asserts the two agree, so they cannot drift.
[functions."nightly-sweep"]
  schedule = "0 20 * * *"
